version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/tryoverflow/ssmhop/internal/cmd.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  footer: |
    **Full changelog**: https://github.com/tryoverflow/ssmhop/compare/{{ .PreviousTag }}...{{ .Tag }}

homebrew_casks:
  - name: ssmhop
    repository:
      owner: tryoverflow
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/tryoverflow/ssmhop
    description: Shells and port forwarding over AWS SSM for EC2 and ECS
    binaries: [ssmhop]
    dependencies:
      - cask: session-manager-plugin
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ssmhop"]
          end
    caveats: |
      fzf is optional and gives a nicer picker layout:
        brew install fzf
